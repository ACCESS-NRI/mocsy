name: Test cmake build

on: [push]

jobs:
  test_conda:
    name: Build testing with ${{ matrix.compiler }}  on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # mpi on windows is a nightmare
        os: ["ubuntu-latest"]
        compiler: ["gfortran", "ifx_linux-64", "flang"]
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: ${{ matrix.python-version }}
          miniforge-version: latest

      - name: Install Our own environment
        shell: bash -el {0}
        run: |
          conda env create --name mocsy-access-nri --file no_compiler_env.yml

      - name: Install our own compiler using conda
        shell: bash -el {0}
        run: |
          conda install -c conda-forge -n pic ${{matrix.compiler}}

      - name: Execute cmake and build for ${{matrix.compiler}}
        shell: bash -el {0}
        run: |
          conda activate pic
          export FC=${{matrix.compiler}}
          cmake -B build
          cmake --build build

